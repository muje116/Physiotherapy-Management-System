name: Production Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.5'

jobs:
  publish-images:
    name: Build and publish production images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare image name
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        run: |
          docker build -f apps/api/Dockerfile -t ghcr.io/${IMAGE_OWNER}/physiocore-api:${GITHUB_SHA} .
          docker push ghcr.io/${IMAGE_OWNER}/physiocore-api:${GITHUB_SHA}
      - name: Build and push worker image
        run: |
          docker build -f apps/worker/Dockerfile -t ghcr.io/${IMAGE_OWNER}/physiocore-worker:${GITHUB_SHA} .
          docker push ghcr.io/${IMAGE_OWNER}/physiocore-worker:${GITHUB_SHA}
      - name: Build and push web image
        run: |
          docker build -f apps/web/Dockerfile -t ghcr.io/${IMAGE_OWNER}/physiocore-web:${GITHUB_SHA} .
          docker push ghcr.io/${IMAGE_OWNER}/physiocore-web:${GITHUB_SHA}

  migrate:
    name: Apply production database migrations
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      - name: Deploy Prisma migrations
        run: pnpm --filter @physiocore/db exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
